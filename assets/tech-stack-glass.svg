<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="glassTitle glassDesc" viewBox="0 0 920 300">
  <title id="glassTitle">Professional focus and studies (glassmorphism)</title>
  <desc id="glassDesc">Cartão com efeito glassmorphism mostrando áreas profissionais em Azure, Security, Microsoft 365, Infrastructure e estudos em DevOps e IaC.</desc>
  <defs>
    <linearGradient id="glassBackground" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="35%" stop-color="#00A4EF"/>
      <stop offset="70%" stop-color="#7FBA00"/>
      <stop offset="100%" stop-color="#FFB900"/>
    </linearGradient>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#001433" flood-opacity="0.25"/>
    </filter>
    <style>
      :root { color-scheme: light dark; }
      .glass-panel { fill: rgba(255,255,255,0.14); stroke: rgba(255,255,255,0.35); stroke-width: 1; }
      .glass-label { fill: #ffffff; font: 700 16px 'Segoe UI', Ubuntu, Arial, sans-serif; }
      .glass-years { fill: #eaf4ff; font: 500 13px 'Segoe UI', Ubuntu, Arial, sans-serif; }
      .track { fill: rgba(255,255,255,0.22); }
      .bar-fill { fill: #ffffff; }
      @media (prefers-color-scheme: dark) {
        .glass-label { fill: #f5f9ff; }
        .glass-years { fill: #cfe6ff; }
      }
    </style>
  </defs>

  <rect width="920" height="300" rx="28" fill="url(#glassBackground)"/>
  <rect width="920" height="300" rx="28" fill="#001433" opacity="0.28" filter="url(#glassBlur)"/>
  <rect x="18" y="18" width="884" height="264" rx="22" class="glass-panel" filter="url(#glassShadow)"/>

  <!-- Azure Architecture -->
  <g transform="translate(46, 56)">
    <text class="glass-label" x="0" y="0">Azure Architecture</text>
    <text class="glass-years" x="0" y="20">Atuação profissional</text>
    <rect class="track" x="0" y="30" width="828" height="10" rx="5"/>
    <rect class="bar-fill" x="0" y="30" width="745" height="10" rx="5"/>
  </g>

  <!-- Security & Identity -->
  <g transform="translate(46, 116)">
    <text class="glass-label" x="0" y="0">Security &amp; Identity</text>
    <text class="glass-years" x="0" y="20">Atuação profissional</text>
    <rect class="track" x="0" y="30" width="828" height="10" rx="5"/>
    <rect class="bar-fill" x="0" y="30" width="787" height="10" rx="5"/>
  </g>

  <!-- Microsoft 365 -->
  <g transform="translate(46, 176)">
    <text class="glass-label" x="0" y="0">Microsoft 365</text>
    <text class="glass-years" x="0" y="20">Atuação profissional</text>
    <rect class="track" x="0" y="30" width="828" height="10" rx="5"/>
    <rect class="bar-fill" x="0" y="30" width="704" height="10" rx="5"/>
  </g>

  <!-- DevOps & IaC studies -->
  <g transform="translate(46, 236)">
    <text class="glass-label" x="0" y="0">DevOps &amp; IaC</text>
    <text class="glass-years" x="0" y="20">Estudo e laboratórios</text>
    <rect class="track" x="0" y="30" width="828" height="10" rx="5"/>
    <rect class="bar-fill" x="0" y="30" width="414" height="10" rx="5"/>
  </g>
</svg>
